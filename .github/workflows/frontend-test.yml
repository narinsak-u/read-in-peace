name: Frontend Tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_SITE_URL: https://reading.example.test
      NUXT_PUBLIC_BACKEND_URL: https://api.reading.example.test
      NUXT_PUBLIC_CENTRAL_IDENTITY_URL: https://auth.example.test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx nuxt prepare
      - run: npm test
