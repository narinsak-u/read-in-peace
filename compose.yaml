services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: read_in_peace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - reading-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d read_in_peace"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  reading-postgres:
